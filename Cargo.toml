[package]
name = "monitor-agent"
version = "0.1.8"
edition = "2021"
license = "MIT"
description = "Linux monitoring agent for the monitor hub"
repository = "https://github.com/stqfdyr/agent"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A single-threaded runtime is plenty: one report every couple of seconds plus
# a handful of tcp probes, on someone else's VPS.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
rustix = { version = "1", features = ["fs"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite 0.28 leaves the crypto provider to us: rustls only picks one
# automatically when exactly one provider feature is on. Without this the agent
# panics on its first wss:// connection, and plain ws:// never notices.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
if-addrs = "0.15.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
