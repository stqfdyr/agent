name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install --locked cross
      - run: cross build --release --locked --target ${{ matrix.target }}
      # install.sh downloads exactly this name; changing it breaks every
      # install command the hub hands out.
      - run: cp "target/${{ matrix.target }}/release/monitor-agent" "monitor-agent-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: monitor-agent-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # A manual dispatch builds and collects the binaries; only a tag publishes,
      # so the whole path can be exercised without cutting a release. gh ships on
      # the runner, keeping a third-party action out of the contents:write step.
      # sha256sums.txt is written from inside a directory holding only the
      # binaries, so the names in it are bare. The hub relays these through
      # whatever GitHub proxy an operator configured, and install.sh writes what
      # comes back to /opt/monitor and runs it -- without a published digest
      # there is nothing anywhere on that path to check it against.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p bin && mv monitor-agent-* bin/
          (cd bin && sha256sum monitor-agent-* > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" bin/monitor-agent-* bin/sha256sums.txt \
            --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
