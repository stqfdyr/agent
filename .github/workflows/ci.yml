name: ci

on:
  push:
    branches: [main]
    # Prose changes nothing a compiler or a linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A test that hangs rather than fails would otherwise sit here burning the
    # six-hour default. The suite runs in well under a second.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The hub repo has checked this all along and this one never did, so a
      # spot in the test module had drifted out of what rustfmt.toml describes.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
